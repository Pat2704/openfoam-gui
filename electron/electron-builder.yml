# ─────────────────────────────────────────────────────────────────────────────
# electron-builder configuration for the OpenFOAM Studio portable .exe.
#
# Run it from the repo root with:
#
#     npm run electron:build
#
# which is a shortcut for:
#
#     node scripts/build-electron.js
#       -> npm run build                        (next build + static/public copy)
#       -> node electron/scripts/prepare-resources.js
#       -> electron-builder --win --projectDir electron \
#                           --config electron/electron-builder.yml
#
# `--projectDir electron` makes electron-builder read electron/package.json
# (name: openfoam-studio, version 2.0.0, main: main.js) as the app manifest,
# which is exactly what ends up inside resources/app.asar.
#
# Note: the original 6.1.4 build was produced on Linux, where electron-builder
# cannot run rcedit and therefore leaves the *inner* OpenFOAMStudio.exe with
# Electron's own version resource ("Electron" / "GitHub, Inc."). Only the outer
# portable .exe carries the OpenFOAM Studio metadata. Building on Windows will
# stamp both — harmless either way.
# ─────────────────────────────────────────────────────────────────────────────

appId: com.openfoamstudio.app
productName: OpenFOAMStudio
copyright: Copyright © OpenFOAM Studio

# Pinned to the Electron that shipped in the original 6.1.4 portable build
# (Electron 31.7.7 / Chromium 126.0.6478.234).
electronVersion: 31.7.7

asar: true

# Compression is deliberately left at the default (LZMA), and here is the
# measurement that settles it.
#
# The NSIS portable stub deletes and re-extracts the whole payload into TEMP on
# EVERY launch — inherent to the format, not something the app can skip. The
# obvious idea is to stop compressing so the extraction becomes a plain copy.
# Measured on 2026-09-02, same machine, three runs each:
#
#     LZMA (87 MB)   29.3 s · 29.0 s
#     store (350 MB) 26.2 s · 26.6 s · 25.7 s
#
# Three seconds for 263 MB. The cost is the COPY, not the decompression, so the
# only thing that actually removes it is not extracting at all: an NSIS
# installer, or shipping the win-unpacked folder (window in ~130 ms, interface
# at ~4 s, measured). Do not try `store` again without re-reading this.

directories:
  output: ../dist-electron
  buildResources: build

# Only these three files go into app.asar — everything else the app needs is
# shipped unpacked under resources/ (see extraResources below), because the
# Next.js standalone server has to be executed by a real node.exe and cannot
# be read from inside an asar archive.
files:
  - main.js
  - preload.js
  - package.json

extraResources:
  # Window + taskbar icon. main.js reads it from <resourcesPath>/icon.ico in
  # production and from electron/build/icon.ico when running unpackaged.
  - from: build/icon.ico
    to: icon.ico
  # Bundled Node runtime that runs the Next.js standalone server.
  - from: resources/bin
    to: bin
  # The assembled Next.js standalone build.
  - from: resources/standalone
    to: standalone
  # The agent's tool server. The app launches Claude Code itself and hands it
  # this as its only tools (src/lib/claude-cli.ts). Dependency-free on purpose:
  # it runs with the bundled node.exe above, and the packaged app ships no
  # node_modules for it to import from.
  - from: mcp
    to: mcp

win:
  target:
    - portable
  icon: build/icon.ico
  artifactName: OpenFOAMStudio-v2-portable.${ext}

portable:
  artifactName: OpenFOAMStudio-v2-portable.${ext}
  unicode: true

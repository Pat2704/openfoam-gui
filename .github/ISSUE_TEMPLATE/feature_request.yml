name: Feature request
description: Suggest something the app should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        Describe the situation, not the solution. Knowing what you are actually
        trying to achieve often leads somewhere better than the feature as asked.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like the app to do?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: In ParaView, in a terminal, by editing files by hand?
